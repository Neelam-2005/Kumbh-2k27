<!DOCTYPE html>
<html>
<head>
    <title>Kumbh 2027 - Login / Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: url('images/sadhu.jpg') no-repeat;
            background-size: cover;
            background-position: center 20%;
        }

        .auth-container{
            width:400px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.15);
            box-shadow:0 20px 40px rgba(0,0,0,0.4);
            text-align:center;
            color:#ff7a00;
        }

        .tabs{display:flex;margin-bottom:20px;}

        .tabs button{
            flex:1;
            padding:10px;
            border:none;
            background:rgba(255,255,255,0.2);
            color:white;
            font-weight:600;
        }

        .tabs button.active{background:#ff7a00;}

        form{display:flex;flex-direction:column;gap:15px;}

        input{
            padding:12px;
            border-radius:10px;
            border:none;
        }

        .auth-btn{
            padding:12px;
            border:none;
            border-radius:25px;
            background:linear-gradient(45deg,#ff7a00,#ff4500);
            color:white;
            font-weight:bold;
        }

        .hidden{display:none;}
    </style>
</head>

<body>

<div class="auth-container">

<h2>Welcome to Kumbh 2027</h2>

<div class="tabs">
<button id="loginTab" class="active" onclick="showLogin()">Login</button>
<button id="signupTab" onclick="showSignup()">Sign Up</button>
</div>

<!-- LOGIN -->
<form id="loginForm">
<input type="email" id="loginEmail" placeholder="Email" required>
<input type="password" id="loginPassword" placeholder="Password" required>
<button type="submit" class="auth-btn">Login</button>
</form>

<!-- SIGNUP -->
<form id="signupForm" class="hidden">
<input type="text" id="signupName" placeholder="Full Name" required>
<input type="email" id="signupEmail" placeholder="Email" required>
<input type="password" id="signupPassword" placeholder="Password" required>
<button type="submit" class="auth-btn">Create Account</button>
</form>

</div>

<script>

const API = "http://127.0.0.1:8000/api";

const loginForm=document.getElementById("loginForm");
const signupForm=document.getElementById("signupForm");

function showLogin(){
loginForm.classList.remove("hidden");
signupForm.classList.add("hidden");
loginTab.classList.add("active");
signupTab.classList.remove("active");
}

function showSignup(){
signupForm.classList.remove("hidden");
loginForm.classList.add("hidden");
signupTab.classList.add("active");
loginTab.classList.remove("active");
}


// SIGNUP → SEND OTP → REDIRECT
signupForm.addEventListener("submit",function(e){
    e.preventDefault();

    const name=document.getElementById("signupName").value;
    const email=document.getElementById("signupEmail").value;
    const password=document.getElementById("signupPassword").value;

    localStorage.setItem("tempUser",JSON.stringify({name,email,password}));

    alert("Sending OTP...");

    fetch(API + "/send-otp/",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({email:email})
    })
    .then(res=>res.json())
    .then(data=>{
        alert("OTP sent!");
        window.location.href="otp.html";
    })
    .catch(err=>{
        console.log(err);
        alert("Server not connected!");
    });
});


// LOGIN (unchanged)
loginForm.addEventListener("submit",function(e){
e.preventDefault();

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value.trim();

const storedUser=JSON.parse(localStorage.getItem("user"));

if(storedUser && email===storedUser.email && password===storedUser.password){
localStorage.setItem("loggedInUser", JSON.stringify(storedUser));
window.location.href="index.html";
}else{
alert("Invalid Credentials!");
}
});

</script>

</body>
</html>
